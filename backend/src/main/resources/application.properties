spring.application.name=backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devpilot}
spring.datasource.username=${DB_USERNAME:devpilot}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#Ai configuration
spring.ai.google.genai.api-key=AQ.Ab8RN6J7yys-tnbMHosyzjQRf_u5_o1yuM9CkFWiFnYHBMVJUQ
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Gemini Embeddings
spring.ai.google.genai.embedding.api-key=AQ.Ab8RN6J7yys-tnbMHosyzjQRf_u5_o1yuM9CkFWiFnYHBMVJUQ
spring.ai.google.genai.embedding.text.model=gemini-embedding-2
spring.ai.google.genai.embedding.text.dimensions=768


#PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# GitHub OAuth2 Configuration
spring.security.oauth2.client.registration.github.client-id=Ov23liMKCYBdrHUcnFDW
spring.security.oauth2.client.registration.github.client-secret=1b61de4adb745fca538b56c26618e6ad7b5ba333
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.registration.github.user-name-attribute=id

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.timeout=7d

#App Settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:defaultpassword}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:8f2a7c91d4e6b103a5f82c7d91e4b620}
app.indexing.max-file-bytes=${INDEXING_MAX_FILE_BYTES:102400}
app.indexing.chunk.size=${CHUNK_SIZE:800}
app.indexing.chunk.overlap=${CHUNK_OVERLAP:200}
app.github.api-delay-ms=${GITHUB_API_DELAY_MS:50}


